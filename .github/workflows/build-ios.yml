name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # Liquid Glass 需要 Xcode 26 / iOS 26 SDK，macos-latest 只有 Xcode 16
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Build unsigned .app
        working-directory: ios-native
        run: |
          xcodebuild \
            -project HPlayer.xcodeproj \
            -scheme HPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R ios-native/build/Build/Products/Release-iphoneos/HPlayer.app Payload/
          zip -r HPlayer-unsigned.ipa Payload
          ls -lh HPlayer-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HPlayer-unsigned-ipa
          path: HPlayer-unsigned.ipa
          retention-days: 30
