name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner image
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-26
          - macos-15-intel
      test_scope:
        description: Simulator test coverage
        type: choice
        default: all
        options:
          - all
          - navigation
          - navigation-details
  push:
    branches: [main, 'feat/*']

jobs:
  build:
    # Select an installed stable Xcode 26 toolchain on either supported architecture.
    runs-on: ${{ inputs.runner || 'macos-15' }}
    # 公开仓库的构建机速度差异很大（同一套测试 5～15 分钟都出现过），整体留足时间，免得跑到一半被取消
    timeout-minutes: 85
    env:
      HPLAYER_TEST_SCOPE: ${{ inputs.test_scope || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          for app in /Applications/Xcode_26.6.app /Applications/Xcode_26.5.app /Applications/Xcode_26.4.app /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.1.app /Applications/Xcode_26.0.1.app; do
            if [[ -d "$app/Contents/Developer" ]]; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Xcode 26 is unavailable on this runner' >&2
          exit 1

      - name: Show toolchain
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: Check icon usage
        run: python3 ios-native/scripts/check-icons.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore verified native frameworks
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ios-native/Vendor/NuvioEngine/NuvioEngine.xcframework
          key: hplayer-nuvio-0.1.6-v2

      - name: Download verified torrent engine
        run: bash ios-native/scripts/prepare-nuvio.sh

      - name: Cache verified native frameworks
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ios-native/Vendor/NuvioEngine/NuvioEngine.xcframework
          key: hplayer-nuvio-0.1.6-v2

      # 引擎检查失败时继续编译 App，这样一次构建就能看到所有问题；最后一步再让整个任务失败
      - name: Verify torrent engine lifecycle
        id: engine-smoke
        continue-on-error: true
        run: |
          engine=ios-native/Vendor/NuvioEngine/NuvioEngine.xcframework/macos-arm64_x86_64
          if ! xcrun swiftc -parse-as-library \
            -I "$engine/Headers" \
            ios-native/Vendor/NuvioEngine/Sources/*.swift \
            ios-native/HPlayer/Services/MagnetLink.swift \
            ios-native/HPlayer/Services/M115Cipher.swift \
            ios-native/scripts/MagnetEngineSmoke.swift \
            "$engine/libCNuvioEngine.a" -Xlinker -lc++ \
            -framework Security -framework SystemConfiguration -framework CoreFoundation -framework AVFoundation \
            -o "$RUNNER_TEMP/magnet-engine-smoke" > "$RUNNER_TEMP/engine-build.log" 2>&1; then
            cat "$RUNNER_TEMP/engine-build.log"
            grep -E "error:" "$RUNNER_TEMP/engine-build.log" | sort -u | head -20 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=Engine check build::$line"; done
            exit 1
          fi
          if ! "$RUNNER_TEMP/magnet-engine-smoke" > "$RUNNER_TEMP/engine-run.log" 2>&1; then
            cat "$RUNNER_TEMP/engine-run.log"
            tail -n 5 "$RUNNER_TEMP/engine-run.log" | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=Engine check::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/engine-run.log"
          sed 's/%/%25/g' "$RUNNER_TEMP/engine-run.log" | while IFS= read -r line; do echo "::notice title=Engine check::$line"; done

      - name: Verify magnet transfer from a local peer
        id: magnet-peer
        if: steps.engine-smoke.outcome == 'success'
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/hplayer-peer" webtorrent@3.0.21 bittorrent-tracker@11.2.3 --omit=optional --no-package-lock --no-audit --no-fund
          cp ios-native/scripts/seed-fixture.mjs "$RUNNER_TEMP/hplayer-peer/seed-fixture.mjs"
          node "$RUNNER_TEMP/hplayer-peer/seed-fixture.mjs" "$RUNNER_TEMP/magnet-fixture.json" "$PWD/ios-native/scripts/magnet-fixture.mp4" &
          seed_pid=$!
          trap 'kill "$seed_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            [[ -s "$RUNNER_TEMP/magnet-fixture.json" ]] && break
            sleep 1
          done
          test -s "$RUNNER_TEMP/magnet-fixture.json"
          passed=0
          for attempt in 1 2; do
            if "$RUNNER_TEMP/magnet-engine-smoke" "$RUNNER_TEMP/magnet-fixture.json" > "$RUNNER_TEMP/peer-run.log" 2>&1; then passed=1; break; fi
            cat "$RUNNER_TEMP/peer-run.log"
            echo "Magnet fixture retry $attempt"
          done
          if [[ "$passed" -ne 1 ]]; then
            tail -n 5 "$RUNNER_TEMP/peer-run.log" | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=Magnet peer check::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/peer-run.log"
          grep -E "Restored|passed" "$RUNNER_TEMP/peer-run.log" | sed 's/%/%25/g' | while IFS= read -r line; do echo "::notice title=Magnet peer check::$line"; done

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      # mpv 播放内核（MPVKit）以 Swift Package 引入，预编译好的二进制包较大，缓存起来
      - name: Restore Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.spm
          key: hplayer-spm-${{ hashFiles('ios-native/project.yml') }}
          restore-keys: |
            hplayer-spm-

      - name: Build unsigned .app
        working-directory: ios-native
        run: |
          if ! xcodebuild \
            -project HPlayer.xcodeproj \
            -scheme HPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.spm" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet > "$RUNNER_TEMP/xcodebuild.log" 2>&1; then
            tail -n 300 "$RUNNER_TEMP/xcodebuild.log"
            grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -20 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=Build::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/xcodebuild.log"

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R ios-native/build/Build/Products/Release-iphoneos/HPlayer.app Payload/
          # 每次构建的版本号（CFBundleVersion）都不同：同一个版本号覆盖安装时，
          # 系统不会刷新桌面图标缓存，装完后图标可能显示为空白。用构建序号保证递增。
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Payload/HPlayer.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/HPlayer.app/Info.plist
          zip -r HPlayer-unsigned.ipa Payload
          ls -lh HPlayer-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HPlayer-unsigned-ipa
          path: HPlayer-unsigned.ipa
          retention-days: 30

      - name: Test on iPhone simulator (${{ env.HPLAYER_TEST_SCOPE }})
        id: native-tests
        # 公开仓库的构建机较慢，测试有时要 7～15 分钟
        timeout-minutes: 60
        run: |
          test_filters=()
          if [[ "$HPLAYER_TEST_SCOPE" == 'navigation' ]]; then
            test_filters=(
              -only-testing:HPlayerTests/HomeNavigationTests
              -only-testing:HPlayerUITests/TabBarUITests
              -only-testing:HPlayerUITests/AnimeNavigationUITests
              -only-testing:HPlayerUITests/CloudNavigationUITests
              -only-testing:HPlayerUITests/PerformerCollectionUITests
              -only-testing:HPlayerUITests/SettingsUITests
              -only-testing:HPlayerUITests/MotionUITests/testCarouselAndSeriesNavigationRemainUsable
              -only-testing:HPlayerUITests/RedesignFlowUITests/testHomeHeaderPinsSearchAndPagesSwipe
              -only-testing:HPlayerUITests/RedesignFlowUITests/testSourcePanelAndFilmMatchingRoute
            )
          elif [[ "$HPLAYER_TEST_SCOPE" == 'navigation-details' ]]; then
            test_filters=(
              -only-testing:HPlayerTests/HomeNavigationTests
              -only-testing:HPlayerUITests/AnimeNavigationUITests
              -only-testing:HPlayerUITests/CloudNavigationUITests
              -only-testing:HPlayerUITests/TabBarUITests/testBackButtonReturnsEachTabWithItsNativeBar
            )
          fi
          echo "Simulator test scope: $HPLAYER_TEST_SCOPE"
          # Match the iPhone 15 Pro's 393-point screen when the runner supports it.
          runtime=$(xcrun simctl list runtimes --json | python3 -c 'import json,re,sys; runtimes=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x["name"].startswith("iOS ")]; runtimes.sort(key=lambda x:tuple(map(int,re.findall(r"[0-9]+",x["version"]))),reverse=True); print(runtimes[0]["identifier"] if runtimes else "")')
          device=""
          if [[ -n "$runtime" ]]; then
            device=$(xcrun simctl create "HPlayer iPhone 15 Pro" "com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro" "$runtime" 2>/dev/null || true)
          fi
          if [[ -z "$device" ]]; then
            echo "iPhone 15 Pro is unavailable; using an installed iPhone simulator."
            device=$(xcrun simctl list devices available --json | python3 -c 'import json,re,sys; d=json.load(sys.stdin)["devices"]; groups=sorted(d.items(),key=lambda pair:tuple(map(int,re.findall(r"[0-9]+",pair[0]))),reverse=True); devices=next(([x for x in group if x.get("isAvailable") and x["name"].startswith("iPhone")] for runtime,group in groups if any(x.get("isAvailable") and x["name"].startswith("iPhone") for x in group)),[]); preferred=next((x for x in devices if "Pro" in x["name"]), devices[0] if devices else None); print(preferred["udid"] if preferred else "")')
          else
            echo "Using iPhone 15 Pro ($device)."
          fi
          test -n "$device"
          xcrun simctl boot "$device" || true
          python3 ios-native/scripts/player-test-server.py > "$RUNNER_TEMP/player-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          xcodebuild test \
            "${test_filters[@]}" \
            -project ios-native/HPlayer.xcodeproj \
            -scheme HPlayer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" \
            -parallel-testing-enabled NO \
            -destination-timeout 90 \
            -derivedDataPath "$RUNNER_TEMP/hplayer-simulator" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.spm" \
            -resultBundlePath "$RUNNER_TEMP/player-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export player UI screenshots
        if: always()
        continue-on-error: true
        run: |
          if [[ -d "$RUNNER_TEMP/player-tests.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/player-tests.xcresult" --output-path "$RUNNER_TEMP/player-ui"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/player-tests.xcresult" > "$RUNNER_TEMP/player-ui/test-summary.json"
            cat "$RUNNER_TEMP/player-ui/test-summary.json"
            python3 - "$RUNNER_TEMP/player-ui" "$RUNNER_TEMP/tab-appearance" <<'PY'
          import json, pathlib, shutil, sys
          source, target = map(pathlib.Path, sys.argv[1:])
          manifest = source / "manifest.json"
          if manifest.exists():
              target.mkdir(parents=True, exist_ok=True)
              names = [f"TabGlass-{material}-{style}" for material in ("system",) for style in ("dark", "light")]
              for test in json.loads(manifest.read_text()):
                  for attachment in test.get("attachments", []):
                      name = attachment.get("suggestedHumanReadableName", "")
                      for expected in names:
                          if name.startswith(expected + "_") and not attachment.get("isAssociatedWithFailure"):
                              shutil.copy2(source / attachment["exportedFileName"], target / (expected + ".png"))
          PY
          fi

      - name: Verify all 47 prototype screenshots
        if: always() && steps.native-tests.outcome != 'skipped' && env.HPLAYER_TEST_SCOPE == 'all'
        run: |
          python3 ios-native/scripts/verify-interface-coverage.py \
            --manifest "$RUNNER_TEMP/player-ui/manifest.json" \
            --coverage docs/prototype-coverage.json \
            --output "$RUNNER_TEMP/player-ui/prototype41"

      - name: Report UI test failures as annotations
        if: always()
        continue-on-error: true
        run: |
          # 测试日志和产物下载不方便时，把失败原因和测试服务器的关键请求直接写进构建注解
          summary="$RUNNER_TEMP/player-ui/test-summary.json"
          if [[ -f "$summary" ]]; then
            python3 - "$summary" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          print(f"::notice title=UI tests::result={data.get('result')} passed={data.get('passedTests')} failed={data.get('failedTests')}")
          for failure in data.get("testFailures", [])[:8]:
              text = f"{failure.get('testName', '')}: {failure.get('failureText', '')}"
              text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f"::warning title=UI test failure::{text[:3000]}")
          PY
          fi
          log="$RUNNER_TEMP/player-http.log"
          if [[ -f "$log" ]]; then
            lines=$(grep -E "STALL" "$log" | tail -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [[ -n "$lines" ]] && echo "::notice title=Stall server requests::$lines"
            lines=$(grep -E "^RANGE|BANGUMI|/catalog/" "$log" | tail -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [[ -n "$lines" ]] && echo "::notice title=Range and metadata server requests::$lines"
          fi

      - name: Upload player UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HPlayer-player-ui-test
          path: ${{ runner.temp }}/player-ui
          if-no-files-found: ignore

      - name: Upload tab appearance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HPlayer-tab-appearance
          path: ${{ runner.temp }}/tab-appearance
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload player HTTP log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HPlayer-player-http-log
          path: ${{ runner.temp }}/player-http.log
          if-no-files-found: ignore

      - name: Fail when engine checks failed
        if: always() && (steps.engine-smoke.outcome == 'failure' || steps.magnet-peer.outcome == 'failure')
        run: |
          echo "::error::Torrent engine checks failed; see the annotations above."
          exit 1
