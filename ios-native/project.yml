name: HPlayer

options:
  bundleIdPrefix: app.hplayer
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.1"

targets:
  HPlayer:
    type: application
    platform: iOS
    sources:
      - path: HPlayer
      - path: Vendor/NuvioEngine/Sources
    dependencies:
      - framework: Vendor/NuvioEngine/NuvioEngine.xcframework
        embed: false
      - framework: Vendor/MobileVLCKit/MobileVLCKit.xcframework
        embed: true
      - sdk: libc++.tbd
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: AVFoundation.framework
      - sdk: CFNetwork.framework
      - sdk: AudioToolbox.framework
      - sdk: OpenGLES.framework
      - sdk: CoreGraphics.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: libxml2.tbd
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
    info:
      path: HPlayer/Info.plist
      properties:
        CFBundleDisplayName: HPlayer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "用于磁力播放时在本机播放缓存并发现局域网节点。"
        CFBundleURLTypes:
          - CFBundleURLName: app.hplayer.magnet
            CFBundleURLSchemes:
              - magnet
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hplayer.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
